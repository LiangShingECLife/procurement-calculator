<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>採購成本試算台 - 良興</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0F1C;
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #E9EDF7;
            min-height: 100vh;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-grotesk { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect, useCallback } = React;
        
        const RATE_BUFFER = 1.05;
        const SHEETS_SPREADSHEET_ID = "15ZYaBbl2GqcbFWX0Z80d-ACbIeRUsmlTLPX59gAXIcc";
        const SHEETS_SHEET_NAME = "海關匯率對照表";
        const SHEETS_API_KEY = "AIzaSyA9PKE-v0xBhg-Up_s-TMRHrORy5oXO014";
        const HISTORY_WRITE_URL = "https://script.google.com/macros/s/AKfycby4lJl8hfOa_6jjyrCDqgcq22cp8OEUkyO9kE8G16I0cfEBh05eHHFUCxQ3fFdBVwX-/exec";

        function writeHistoryToSheet(payload) {
            return fetch(HISTORY_WRITE_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload),
            });
        }

        async function fetchAllLiveRates() {
            const range = encodeURIComponent(SHEETS_SHEET_NAME + "!B2:B3");
            const url = "https://sheets.googleapis.com/v4/spreadsheets/" + SHEETS_SPREADSHEET_ID + "/values/" + range + "?key=" + encodeURIComponent(SHEETS_API_KEY);
            const res = await fetch(url);
            if (!res.ok) throw new Error("Google Sheet 讀取失敗");
            const data = await res.json();
            const usd = parseFloat(data?.values?.[0]?.[0]);
            const cny = parseFloat(data?.values?.[1]?.[0]);
            if (!usd || !cny || isNaN(usd) || isNaN(cny)) throw new Error("Sheet 儲存格無有效數值");
            return { USD: usd, CNY: cny };
        }

        const INITIAL_VENDOR_SHEET = [
            { vendor: "Mouser", defaultCurrency: "USD", freeShippingThreshold: 50, shippingFee: 20, handlingFeePercent: 0, otherFee: 0, formulaType: "STANDARD_THRESHOLD" },
            { vendor: "DigiKey", defaultCurrency: "USD", freeShippingThreshold: 50, shippingFee: 20, handlingFeePercent: 0, otherFee: 0, formulaType: "STANDARD_THRESHOLD" },
            { vendor: "LCSC", defaultCurrency: "CNY", freeShippingThreshold: 0, shippingFee: 0, handlingFeePercent: 3, otherFee: 5, formulaType: "PERCENTAGE_ONLY" },
            { vendor: "Arrow", defaultCurrency: "USD", freeShippingThreshold: 100, shippingFee: 25, handlingFeePercent: 2.5, otherFee: 10, formulaType: "TIERED_QTY_DISCOUNT" }
        ];

        const COLUMN_META = [
            { key: "vendor", label: "A · vendor" },
            { key: "defaultCurrency", label: "B · defaultCurrency" },
            { key: "freeShippingThreshold", label: "C · freeShippingThreshold" },
            { key: "shippingFee", label: "D · shippingFee" },
            { key: "handlingFeePercent", label: "E · handlingFeePercent" },
            { key: "otherFee", label: "F · otherFee" },
            { key: "formulaType", label: "G · formulaType" }
        ];
        const REQUIRED_KEYS = COLUMN_META.map(c => c.key);

        const fmtUSD = (n) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtTWD = (n) => "NT$" + Math.round(Number(n || 0)).toLocaleString("en-US");
        const fmtTWDUnit = (n) => {
            const val = Math.ceil(Number(n || 0) * 100) / 100;
            return "NT$" + val.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        function bridgeCurrency(amount, from, to, liveRates) {
            if (from === to) return amount;
            const fromRate = liveRates[from] ?? 1;
            const toRate = liveRates[to] ?? 1;
            return (amount * fromRate) / toRate;
        }

        function computeQuote(row, { exchangeRate, exchangeCurrency, unitCost, unitCostCurrency, quantity, tariffRate, liveRates }) {
            const unitCostUSD = bridgeCurrency(unitCost, unitCostCurrency, "USD", liveRates);
            const subtotalUSD = unitCostUSD * quantity;
            let shippingUSD = 0;
            let handlingUSD = 0;
            let trace = "";

            switch (row.formulaType) {
                case "STANDARD_THRESHOLD":
                    const overThreshold = subtotalUSD >= row.freeShippingThreshold;
                    shippingUSD = overThreshold ? 0 : row.shippingFee;
                    handlingUSD = (subtotalUSD * row.handlingFeePercent) / 100;
                    trace = `STANDARD_THRESHOLD → 小計 ${fmtUSD(subtotalUSD)} ${overThreshold ? "≥" : "<"} 免運門檻 $${row.freeShippingThreshold} ⇒ 運費 ${fmtUSD(shippingUSD)}`;
                    break;
                case "FLAT_HANDLING_NO_THRESHOLD":
                    shippingUSD = row.shippingFee;
                    handlingUSD = (subtotalUSD * row.handlingFeePercent) / 100;
                    trace = `FLAT_HANDLING_NO_THRESHOLD → 固定運費 ${fmtUSD(shippingUSD)}`;
                    break;
                case "PERCENTAGE_ONLY":
                    shippingUSD = 0;
                    handlingUSD = (subtotalUSD * row.handlingFeePercent) / 100;
                    trace = `PERCENTAGE_ONLY → 報價已含運費`;
                    break;
                case "TIERED_QTY_DISCOUNT":
                    const tierQty = row.freeShippingThreshold;
                    const overTier = quantity >= tierQty;
                    const effectiveRate = overTier ? row.handlingFeePercent / 2 : row.handlingFeePercent;
                    shippingUSD = row.shippingFee;
                    handlingUSD = (subtotalUSD * effectiveRate) / 100;
                    trace = `TIERED_QTY_DISCOUNT → 數量 ${quantity} ${overTier ? "≥" : "<"} 級距門檻 ${tierQty}`;
                    break;
                default:
                    shippingUSD = subtotalUSD >= row.freeShippingThreshold ? 0 : row.shippingFee;
                    handlingUSD = (subtotalUSD * row.handlingFeePercent) / 100;
                    trace = `預設計算邏輯`;
            }

            const feesUSD = handlingUSD + row.otherFee;
            const tariffUSD = subtotalUSD * (Number(tariffRate) / 100);
            const totalUSD = subtotalUSD + shippingUSD + feesUSD + tariffUSD;
            const totalForeign = bridgeCurrency(totalUSD, "USD", exchangeCurrency, liveRates);
            const totalTWD = totalForeign * exchangeRate;

            return { subtotalUSD, shippingUSD, feesUSD, tariffUSD, totalUSD, totalTWD, trace };
        }

        function App() {
            const [vendorSheet, setVendorSheet] = useState(INITIAL_VENDOR_SHEET);
            const [selectedVendor, setSelectedVendor] = useState(INITIAL_VENDOR_SHEET[0].vendor);
            const [showSheetPreview, setShowSheetPreview] = useState(false);
            const fileInputRef = useRef(null);

            const activeRow = useMemo(() => vendorSheet.find(r => r.vendor === selectedVendor) || vendorSheet[0], [vendorSheet, selectedVendor]);
            
            const [exchangeCurrency, setExchangeCurrency] = useState(activeRow.defaultCurrency);
            const [exchangeRate, setExchangeRate] = useState(0);
            const [liveRates, setLiveRates] = useState({ USD: null, CNY: null, NTD: 1 });
            const [unitCostCurrency, setUnitCostCurrency] = useState(activeRow.defaultCurrency);
            const [unitCost, setUnitCost] = useState("");
            const [quantity, setQuantity] = useState(1);
            const [history, setHistory] = useState([]);
            const [manualTariffRate, setManualTariffRate] = useState(0);
            const [rateLoading, setRateLoading] = useState(false);
            const [rateError, setRateError] = useState("");
            const [rateUpdatedAt, setRateUpdatedAt] = useState(null);

            const refreshLiveRates = useCallback(async (applyToCurrency) => {
                setRateLoading(true);
                setRateError("");
                try {
                    const raw = await fetchAllLiveRates();
                    const buffered = {
                        USD: Number((raw.USD * RATE_BUFFER).toFixed(4)),
                        CNY: Number((raw.CNY * RATE_BUFFER).toFixed(4)),
                        NTD: 1,
                    };
                    setLiveRates(buffered);
                    setRateUpdatedAt(new Date().toLocaleString("zh-TW", { hour12: false }));
                    if (applyToCurrency) setExchangeRate(buffered[applyToCurrency] ?? 0);
                } catch (err) {
                    setRateError("匯率抓取失敗");
                } finally {
                    setRateLoading(false);
                }
            }, []);

            useEffect(() => {
                refreshLiveRates(exchangeCurrency);
            }, []);

            function handleExchangeCurrencyChange(newCurrency) {
                setExchangeCurrency(newCurrency);
                setExchangeRate(liveRates[newCurrency] ?? 0);
            }

            function handleVendorChange(vendorName) {
                const row = vendorSheet.find(r => r.vendor === vendorName);
                if (!row) return;
                setSelectedVendor(vendorName);
                handleExchangeCurrencyChange(row.defaultCurrency);
                setUnitCostCurrency(row.defaultCurrency);
                setUnitCost("");
                setQuantity(1);
            }

            const quote = useMemo(() => computeQuote(activeRow, {
                exchangeRate: Number(exchangeRate) || 0,
                exchangeCurrency,
                unitCost: Number(unitCost) || 0,
                unitCostCurrency,
                quantity: Number(quantity) || 0,
                tariffRate: Number(manualTariffRate) || 0,
                liveRates,
            }), [activeRow, exchangeRate, exchangeCurrency, unitCost, unitCostCurrency, quantity, manualTariffRate, liveRates]);

            const qtyNum = Number(quantity) || 0;
            const finalUnitCostTWD = qtyNum > 0 ? quote.totalTWD / qtyNum : null;

            function handleAddHistory() {
                const entry = {
                    id: Date.now(),
                    vendor: activeRow.vendor,
                    exchangeRate: Number(exchangeRate),
                    exchangeCurrency,
                    unitCost: Number(unitCost),
                    unitCostCurrency,
                    quantity: Number(quantity),
                    tariffRate: Number(manualTariffRate),
                    ...quote,
                    timestamp: new Date().toLocaleString("zh-TW", { hour12: false }),
                };
                setHistory(h => [entry, ...h]);
                writeHistoryToSheet(entry);
            }

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-8">
                    <header className="mb-6 flex justify-between items-baseline">
                        <div>
                            <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">Excel 驅動型 · 跨境零件採購成本引擎</span>
                            <h1 className="text-2xl font-bold font-grotesk mt-1">採購成本試算台</h1>
                        </div>
                    </header>

                    {/* 控制區 */}
                    <div className="bg-[#121A2C] border border-[#29344E] rounded-2xl p-6 mb-6 shadow-xl">
                        <h2 className="text-base font-semibold font-grotesk mb-4 text-[#E3B341]">試算變數</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label className="block text-xs font-mono text-slate-400 uppercase mb-2">廠商</label>
                                <select className="w-full bg-[#1A2438] border border-[#29344E] rounded-xl p-3 text-sm font-mono text-white outline-none" value={selectedVendor} onChange={(e) => handleVendorChange(e.target.value)}>
                                    {vendorSheet.map(r => <option key={r.vendor} value={r.vendor}>{r.vendor}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-mono text-slate-400 uppercase mb-2">計價匯率 ({exchangeCurrency})</label>
                                <div className="flex bg-[#1A2438] border border-[#29344E] rounded-xl overflow-hidden">
                                    <select className="bg-transparent border-r border-[#29344E] p-3 text-sm font-mono text-white outline-none" value={exchangeCurrency} onChange={(e) => handleExchangeCurrencyChange(e.target.value)}>
                                        <option value="USD">USD</option>
                                        <option value="CNY">CNY</option>
                                        <option value="NTD">NTD</option>
                                    </select>
                                    <input className="w-full bg-transparent p-3 text-sm font-mono text-white outline-none" type="number" step="0.01" value={exchangeRate} onChange={(e) => setExchangeRate(e.target.value)} />
                                </div>
                                <button className="mt-2 text-xs font-mono text-[#3BD6A0] hover:underline flex items-center gap-1" onClick={() => refreshLiveRates(exchangeCurrency)} disabled={rateLoading}>
                                    {rateLoading ? "更新中..." : "↻ 強制更新最新匯率"}
                                </button>
                                {rateUpdatedAt && <div className="text-[10px] text-slate-500 font-mono mt-1">更新於 {rateUpdatedAt} (含5%緩衝)</div>}
                            </div>
                            <div>
                                <label className="block text-xs font-mono text-slate-400 uppercase mb-2">單位成本</label>
                                <div className="flex bg-[#1A2438] border border-[#29344E] rounded-xl overflow-hidden">
                                    <select className="bg-transparent border-r border-[#29344E] p-3 text-sm font-mono text-white outline-none" value={unitCostCurrency} onChange={(e) => setUnitCostCurrency(e.target.value)}>
                                        <option value="USD">USD</option>
                                        <option value="CNY">CNY</option>
                                        <option value="NTD">NTD</option>
                                    </select>
                                    <input className="w-full bg-transparent p-3 text-sm font-mono text-white outline-none" type="number" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} placeholder="輸入單價" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-mono text-slate-400 uppercase mb-2">採購數量</label>
                                <input className="w-full bg-[#1A2438] border border-[#29344E] rounded-xl p-3 text-sm font-mono text-white outline-none" type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} />
                            </div>
                        </div>
                        <div className="mt-4 flex gap-4 items-center">
                            <div className="w-48">
                                <label className="block text-xs font-mono text-slate-400 uppercase mb-2">關稅率 (%)</label>
                                <input className="w-full bg-[#1A2438] border border-[#29344E] rounded-xl p-3 text-sm font-mono text-white outline-none" type="number" step="0.1" value={manualTariffRate} onChange={(e) => setManualTariffRate(e.target.value)} />
                            </div>
                            <div className="flex-1 pt-6">
                                <button className="w-full bg-[#E3B341] text-[#241C08] font-bold py-3 px-6 rounded-xl hover:brightness-105 transition shadow-lg" onClick={handleAddHistory}>
                                    + 加入歷史紀錄
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 數據面板 */}
                    <div className="bg-[#121A2C] border border-[#29344E] rounded-2xl p-6 mb-6 shadow-xl">
                        <h2 className="text-base font-semibold font-grotesk mb-4 text-[#E3B341]">試算結果</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="bg-[#1A2438] border border-[#29344E] rounded-xl p-4">
                                <div className="text-xs font-mono text-slate-400 uppercase mb-1">預估運費 (USD)</div>
                                <div className="text-xl font-mono text-[#3BD6A0] font-bold">{fmtUSD(quote.shippingUSD)}</div>
                            </div>
                            <div className="bg-[#1A2438] border border-[#29344E] rounded-xl p-4">
                                <div className="text-xs font-mono text-slate-400 uppercase mb-1">手續費 / 其他 (USD)</div>
                                <div className="text-xl font-mono font-bold">{fmtUSD(quote.feesUSD)}</div>
                            </div>
                            <div className="bg-[#1A2438] border border-[#29344E] rounded-xl p-4">
                                <div className="text-xs font-mono text-slate-400 uppercase mb-1">關稅估計 (USD)</div>
                                <div className="text-xl font-mono font-bold">{fmtUSD(quote.tariffUSD)}</div>
                            </div>
                            <div className="bg-gradient-to-br from-[#E3B341]/20 to-[#E3B341]/5 border border-[#E3B341]/50 rounded-xl p-4">
                                <div className="text-xs font-mono text-slate-300 uppercase mb-1">無條件進位單價 (TWD／件)</div>
                                <div className="text-2xl font-mono text-[#E3B341] font-bold">
                                    {finalUnitCostTWD === null ? "—" : fmtTWDUnit(finalUnitCostTWD)}
                                </div>
                            </div>
                        </div>
                        <div className="mt-4 bg-[#0D1424] border border-dashed border-[#29344E] rounded-xl p-3 text-xs font-mono text-[#3BD6A0]">
                            <span className="text-slate-400 mr-2 uppercase">計算公式追蹤:</span> {quote.trace}
                        </div>
                    </div>

                    {/* 歷史紀錄 */}
                    <div className="bg-[#121A2C] border border-[#29344E] rounded-2xl p-6 shadow-xl">
                        <h2 className="text-base font-semibold font-grotesk mb-4 text-[#E3B341]">歷史紀錄</h2>
                        {history.length === 0 ? (
                            <div className="text-center py-8 text-slate-500 text-sm">尚無紀錄 — 調整上方參數後點擊「加入歷史紀錄」</div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left font-mono text-xs">
                                    <thead>
                                        <tr className="border-b border-[#29344E] text-slate-400">
                                            <th className="p-3">時間</th>
                                            <th className="p-3">廠商</th>
                                            <th className="p-3">數量</th>
                                            <th className="p-3">總成本(TWD)</th>
                                            <th className="p-3 text-[#E3B341]">進位單價(TWD)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {history.map(r => {
                                            const rFinalTWD = r.quantity > 0 ? r.totalTWD / r.quantity : 0;
                                            return (
                                                <tr key={r.id} className="border-b border-[#29344E]/50 hover:bg-[#1A2438]">
                                                    <td className="p-3 text-slate-400">{r.timestamp}</td>
                                                    <td className="p-3">{r.vendor}</td>
                                                    <td className="p-3">{r.quantity}</td>
                                                    <td className="p-3">{fmtTWD(r.totalTWD)}</td>
                                                    <td className="p-3 text-[#E3B341] font-bold">{fmtTWDUnit(rFinalTWD)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
