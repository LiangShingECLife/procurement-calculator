        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

        * { box-sizing: border-box; }
        .app {
          --ink: #05070D;
          --panel: #121A2C;
          --panel-raised: #1A2438;
          --border: #29344E;
          --text: #E9EDF7;
          --text-dim: #8592B0;
          --gold: #E3B341;
          --teal: #3BD6A0;
          --coral: #F0725A;
          font-family: 'Inter', sans-serif;
          background: var(--ink);
          background-image:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
          background-size: 28px 28px;
          color: var(--text);
          min-height: 100vh;
          padding: 32px 20px 64px;
        }
        .shell { max-width: 1080px; margin: 0 auto; }
        .masthead { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        .masthead h1 {
          font-family: 'Space Grotesk', sans-serif;
          font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em;
        }
        .masthead .eyebrow {
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase;
          display: block; margin-bottom: 6px;
        }

        .card {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 14px;
          box-shadow: 0 6px 18px rgba(0,0,0,0.35);
          padding: 20px;
          margin-bottom: 20px;
        }
        .card-title {
          font-family: 'Space Grotesk', sans-serif;
          font-size: 15px; font-weight: 600; margin: 0 0 14px;
          display: flex; align-items: center; gap: 8px;
        }

        .import-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .btn {
          font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px;
          border-radius: 9px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--border);
          display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s ease;
        }
        .btn-primary { background: var(--gold); color: #241C08; border-color: var(--gold); }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-ghost { background: transparent; color: var(--text); }
        .btn-ghost:hover { background: var(--panel-raised); }
        .btn-sm { padding: 7px 12px; font-size: 12.5px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        .error-banner {
          margin-top: 12px; padding: 10px 14px; border-radius: 9px;
          background: rgba(240,114,90,0.12); border: 1px solid rgba(240,114,90,0.4);
          color: var(--coral); font-size: 13px; font-family: 'JetBrains Mono', monospace;
        }

        .notice-banner {
          margin-bottom: 14px; padding: 10px 14px; border-radius: 9px;
          background: rgba(227,179,65,0.12); border: 1px solid rgba(227,179,65,0.4);
          color: var(--gold); font-size: 13px; font-family: 'JetBrains Mono', monospace; line-height: 1.6;
        }

        .origin-btn {
          font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px;
          border-radius: 9px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--border);
          background: var(--panel-raised); color: var(--text); transition: all 0.15s ease;
        }
        .origin-btn:hover { background: rgba(227,179,65,0.1); }
        .origin-btn.active { background: var(--gold); color: #241C08; border-color: var(--gold); }

        .split-toggle {
          display: flex; margin-top: 10px; border-radius: 8px; overflow: hidden;
          border: 1px solid var(--border);
        }
        .split-half {
          flex: 1 1 0; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px;
          padding: 7px 6px; cursor: pointer; border: none; background: var(--panel);
          color: var(--text-dim); transition: all 0.15s ease; white-space: nowrap;
        }
        .split-half:not(:last-child) { border-right: 1px solid var(--border); }
        .split-half:hover { background: rgba(59,214,160,0.1); color: var(--text); }
        .split-half.active { background: var(--teal); color: #06231A; }

        .sheet-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
        .sheet-table th, .sheet-table td { padding: 9px 10px; border: 1px solid var(--border); text-align: left; white-space: nowrap; }
        .sheet-table thead tr:first-child th { background: var(--panel-raised); color: var(--gold); font-weight: 600; }
        .sheet-table thead tr:last-child th { color: var(--text-dim); font-weight: 500; }
        .sheet-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .sheet-table tbody tr:hover { background: rgba(227,179,65,0.06); }

        .controls-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 16px;
          align-items: end;
        }
        .field label {
          display: block; font-size: 11.5px; color: var(--text-dim);
          font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em;
          text-transform: uppercase; margin-bottom: 7px;
        }
        .field-combo { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--panel-raised); }
        .field-combo select, .field-combo input, select.select-solo, input.input-solo {
          background: transparent; border: none; color: var(--text);
          font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 10px;
          outline: none; width: 100%;
        }
        select.select-solo, input.input-solo {
          border: 1px solid var(--border); border-radius: 9px; background: var(--panel-raised);
        }
        .field-combo select { flex: 0 0 74px; border-right: 1px solid var(--border); cursor: pointer; }
        .field-combo input { flex: 1; min-width: 0; }
        .rate-refresh {
          margin-top: 8px; display: flex; align-items: center; gap: 6px;
          font-size: 11.5px; color: var(--teal); cursor: pointer; background: none; border: none;
          font-family: 'JetBrains Mono', monospace; padding: 0;
        }
        .rate-refresh:hover { text-decoration: underline; }
        .rate-refresh:disabled { opacity: 0.6; cursor: default; text-decoration: none; }
        .rate-refresh .spin { animation: spin 0.8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .rate-error { margin-top: 6px; font-size: 11.5px; color: var(--coral); font-family: 'JetBrains Mono', monospace; }
        .rate-meta { margin-top: 6px; font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

        .add-history-btn { width: 100%; justify-content: center; margin-top: 4px; }

        .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
        .stat {
          background: var(--panel-raised); border: 1px solid var(--border); border-radius: 12px;
          padding: 18px;
        }
        .stat .stat-label { font-size: 11.5px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
        .stat .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; }
        .stat.total { background: linear-gradient(145deg, rgba(227,179,65,0.14), rgba(227,179,65,0.03)); border-color: rgba(227,179,65,0.5); }
        .stat.total .stat-value { color: var(--gold); font-size: 28px; }
        .stat.ship .stat-value { color: var(--teal); }

        .trace-strip {
          margin-top: 16px; position: relative;
          background: #0D1424; border: 1px dashed var(--border); border-radius: 10px;
          padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
          color: var(--teal); line-height: 1.6; word-break: break-word;
        }
        .trace-strip .trace-tag {
          color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 8px;
        }

        .history-table-wrap { overflow-x: auto; }
        table.history { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1250px; }
        table.history th { text-align: left; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 12px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-weight: 500; }
        table.history td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
        table.history tbody tr:hover { background: var(--panel-raised); }
        table.history td.total-cell { color: var(--gold); font-weight: 600; }
        .del-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; border-radius: 6px; }
        .del-btn:hover { color: var(--coral); background: rgba(240,114,90,0.1); }
        .empty-state { text-align: center; padding: 36px 12px; color: var(--text-dim); font-size: 13.5px; }

        @media (max-width: 640px) {
          .masthead h1 { font-size: 21px; }
          .stat.total .stat-value { font-size: 24px; }
        }
